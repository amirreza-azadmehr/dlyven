name: Release

# App pushes to main cut the next patch (v1.0.2 → v1.0.3), build every OS,
# and GitHub fills in the changelog from the commits.
# Docs / site / README / locale-only pushes do nothing here.
# Manual tag v*.*.* still works. Add [skip release] to a commit to opt out.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if this push is only docs/site"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  decide:
    name: Decide
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    outputs:
      should: ${{ steps.d.outputs.should }}
      version: ${{ steps.d.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch tags
        run: git fetch --tags --force
      - id: d
        env:
          BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          FORCE: ${{ github.event.inputs.force }}
        run: python3 scripts/auto-release.py

  build:
    name: Build ${{ matrix.name }}
    needs: decide
    if: |
      always() &&
      !cancelled() &&
      (
        (startsWith(github.ref, 'refs/tags/v') && needs.decide.result == 'skipped') ||
        (needs.decide.result == 'success' && needs.decide.outputs.should == 'true')
      )
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            artifact: Dlyven-windows-amd64.exe
          - name: macos-universal
            os: macos-latest
            artifact: Dlyven-macos-universal.zip
          - name: linux-amd64
            os: ubuntu-24.04
            artifact: Dlyven-linux-amd64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            artifact: Dlyven-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux WebKit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ needs.decide.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Import Apple Developer ID
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERTIFICATE_P12}" ]; then
            echo "No MACOS_CERTIFICATE_P12 secret — macOS build will stay unsigned (Gatekeeper warning)."
            exit 0
          fi
          CERT="$RUNNER_TEMP/dlyven.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$RUNNER_TEMP/dlyven.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/dlyven.keychain"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$RUNNER_TEMP/dlyven.keychain"
          security import "$CERT" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/dlyven.keychain"
          security list-keychain -d user -s "$RUNNER_TEMP/dlyven.keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERTIFICATE_PASSWORD" "$RUNNER_TEMP/dlyven.keychain"
          rm -f "$CERT"
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          WIN_CERTIFICATE_PFX: ${{ secrets.WIN_CERTIFICATE_PFX }}
          WIN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: powershell -ExecutionPolicy Bypass -File scripts\build.ps1 -Version $env:VERSION
      - name: Build macOS
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/build.sh darwin
      - name: Build Linux
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/build.sh linux
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.name }}" in
            windows-amd64)
              cp build/bin/Dlyven.exe dist/${{ matrix.artifact }}
              ;;
            macos-universal)
              (cd build/bin && zip -r "$GITHUB_WORKSPACE/dist/${{ matrix.artifact }}" Dlyven.app)
              ;;
            linux-amd64|linux-arm64)
              cp build/bin/Dlyven dist/${{ matrix.artifact }}
              chmod +x dist/${{ matrix.artifact }}
              ;;
          esac
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path("dist") / "${{ matrix.artifact }}"
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          (p.parent / f"{p.name}.sha256").write_text(f"{digest}  {p.name}\n")
          print(f"{digest}  {p.name}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    name: GitHub Release
    needs: [decide, build]
    runs-on: ubuntu-latest
    if: |
      always() &&
      !cancelled() &&
      needs.build.result != 'cancelled' &&
      needs.build.result != 'skipped' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (needs.decide.result == 'success' && needs.decide.outputs.should == 'true')
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: |
          cd dist
          cat *.sha256 | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Tag
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          git fetch --tags --force
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists"
          else
            git tag "v${VERSION}" "${GITHUB_SHA}"
            git push origin "v${VERSION}"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.decide.outputs.version) }}
          generate_release_notes: true
          files: dist/*
