name: Release

# App pushes to main cut the next patch (v1.0.2 → v1.0.3), build every OS,
# and GitHub fills in the changelog from the commits.
# Docs / site / README / locale-only pushes do nothing here.
# Manual tag v*.*.* still works (the tag must be on main). Add [skip release] to a
# commit to opt out; Run workflow with force overrides that marker.
# Decide (scripts/auto-release.py) also refuses reused versions, a commit that isn't
# main's tip, a tag on another commit, and a version that is already published.
#
# Tagging: if the repo rules restrict tag creation, the default GITHUB_TOKEN can't tag.
# Set the RELEASE_TAG_TOKEN secret (a token whose owner may create tags; see
# docs/RELEASING.md); main pushes then only push the tag
# and the tag-triggered run builds and publishes, so nothing is built twice.
# Pull requests build every OS unsigned (fallback mode) and publish nothing.
#
# Signing is optional and secret-driven; see SIGNING.md. Missing secrets never
# fail the build, they only drop that platform to its fallback:
#   macOS    Developer ID + notarization, else ad-hoc signature
#   Windows  PFX, Azure Artifact Signing, or SignPath, else unsigned
#   Linux    SHA256SUMS.txt (+ .asc when a GPG key is set)
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if this push is only docs/site"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  decide:
    name: Decide
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    outputs:
      should: ${{ steps.d.outputs.should }}
      version: ${{ steps.d.outputs.version }}
      tagger: ${{ steps.d.outputs.tagger }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch tags
        run: git fetch --tags --force
      - name: Test the release decision
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - id: d
        env:
          BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          FORCE: ${{ github.event.inputs.force }}
          HAS_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN != '' }}
        run: python3 scripts/auto-release.py
      # Published releases are immutable: never build over one, whatever triggered this.
      - name: Refuse to overwrite a published release
        if: steps.d.outputs.should == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.d.outputs.version }}
        run: |
          draft="$(gh release view "v${VERSION}" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [ "$draft" = false ]; then
            echo "::error::v${VERSION} is already published; cut a new version instead of rebuilding it"
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: decide
    # With RELEASE_TAG_TOKEN, a main push only tags (job "tag"); the tag run builds.
    if: |
      always() &&
      !cancelled() &&
      (
        (github.event_name == 'pull_request' && needs.decide.result == 'skipped') ||
        (
          needs.decide.result == 'success' &&
          needs.decide.outputs.should == 'true' &&
          (startsWith(github.ref, 'refs/tags/v') || needs.decide.outputs.tagger != 'app')
        )
      )
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read # SignPath downloads the unsigned exe from this run's artifacts
    # Asset names are stable (no version) so README links to releases/latest/download/<name>
    # keep working, and the in-app updater (internal/updater/assets.go) can find them.
    # Rename one here and there together; TestAssetNamesMatchWorkflow catches drift.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            artifact: Dlyven-Windows-x64-Portable.exe
            installer: Dlyven-Windows-x64-Setup.exe
          - name: macos-universal
            os: macos-latest
            artifact: Dlyven-macOS-Universal.zip
            installer: Dlyven-macOS-Universal.dmg
          - name: linux-amd64
            os: ubuntu-24.04
            artifact: Dlyven-Linux-x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            artifact: Dlyven-Linux-ARM64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux WebKit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Version
        id: ver
        shell: bash
        env:
          DECIDED_VERSION: ${{ needs.decide.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            base="$(grep -o '"productVersion": *"[^"]*"' wails.json | cut -d'"' -f4)"
            echo "version=${base}-pr.${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${DECIDED_VERSION}" >> "$GITHUB_OUTPUT"
          fi
      # wails.json feeds the macOS Info.plist and the Windows file/installer version; without
      # this they'd show whatever version was last committed. Numeric part only (PR builds
      # are 1.2.3-pr.N), so Windows version resources get plain x.y.z.
      - name: Stamp version into wails.json
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e 'const fs = require("fs"); const j = JSON.parse(fs.readFileSync("wails.json", "utf8")); j.info.productVersion = process.argv[1]; fs.writeFileSync("wails.json", JSON.stringify(j, null, 2) + "\n")' "${VERSION%%-*}"
          grep '"productVersion"' wails.json

      # `secrets` can't be used in `if:`, so presence becomes step outputs here.
      # New names first, legacy names (MACOS_*, WIN_*) as fallback.
      - name: Detect signing secrets
        id: signing
        if: runner.os != 'Linux'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE || secrets.MACOS_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE || secrets.WIN_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD || secrets.WIN_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: bash .github/scripts/detect-signing.sh

      # ---------------------------------------------------------------- Windows
      - name: NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) { exit 0 }
          $dir = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path "$dir\makensis.exe")) { choco install nsis -y --no-progress }
          if (-not (Test-Path "$dir\makensis.exe")) { throw 'makensis not found after installing NSIS' }
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: powershell -ExecutionPolicy Bypass -File scripts\build.ps1 -Version $env:VERSION -Installer -NoSign

      # App exe first, so the installer below packs a signed copy.
      - name: Sign app exe (PFX)
        if: runner.os == 'Windows' && steps.signing.outputs.windows_sign == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE || secrets.WIN_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD || secrets.WIN_CERTIFICATE_PASSWORD }}
        run: powershell -ExecutionPolicy Bypass -File scripts\sign-windows.ps1 -Exe build\bin\Dlyven.exe
      - name: Sign app exe (Azure Artifact Signing)
        if: runner.os == 'Windows' && steps.signing.outputs.windows_sign == 'azure'
        uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\build\bin\Dlyven.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Dlyven
      - name: Upload app exe for SignPath
        id: signpath-app
        if: runner.os == 'Windows' && steps.signing.outputs.windows_sign == 'signpath'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signpath-unsigned-app
          path: build/bin/Dlyven.exe
          retention-days: 1
      - name: Sign app exe (SignPath)
        if: runner.os == 'Windows' && steps.signing.outputs.windows_sign == 'signpath'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          connector-url: https://githubactions.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signpath-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signpath/app
      - name: Use SignPath-signed app exe
        if: runner.os == 'Windows' && steps.signing.outputs.windows_sign == 'signpath'
        shell: pwsh
        run: Copy-Item build\signpath\app\Dlyven.exe build\bin\Dlyven.exe -Force

      - name: Repack installer with signed exe
        if: runner.os == 'Windows' && steps.signing.outputs.windows_sign != 'none'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\package-nsis.ps1 -Exe build\bin\Dlyven.exe

      - name: Sign installer (PFX)
        if: runner.os == 'Windows' && steps.signing.outputs.windows_sign == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE || secrets.WIN_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD || secrets.WIN_CERTIFICATE_PASSWORD }}
        run: powershell -ExecutionPolicy Bypass -File scripts\sign-windows.ps1 -Exe build\bin\Dlyven-amd64-installer.exe
      - name: Sign installer (Azure Artifact Signing)
        if: runner.os == 'Windows' && steps.signing.outputs.windows_sign == 'azure'
        uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\build\bin\Dlyven-amd64-installer.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Dlyven Setup
      - name: Upload installer for SignPath
        id: signpath-installer
        if: runner.os == 'Windows' && steps.signing.outputs.windows_sign == 'signpath'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signpath-unsigned-installer
          path: build/bin/Dlyven-amd64-installer.exe
          retention-days: 1
      - name: Sign installer (SignPath)
        if: runner.os == 'Windows' && steps.signing.outputs.windows_sign == 'signpath'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          connector-url: https://githubactions.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signpath-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signpath/installer
      - name: Use SignPath-signed installer
        if: runner.os == 'Windows' && steps.signing.outputs.windows_sign == 'signpath'
        shell: pwsh
        run: Copy-Item build\signpath\installer\Dlyven-amd64-installer.exe build\bin\Dlyven-amd64-installer.exe -Force

      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          METHOD: ${{ steps.signing.outputs.windows_sign }}
        run: |
          $files = 'build\bin\Dlyven.exe', 'build\bin\Dlyven-amd64-installer.exe'
          if ($env:METHOD -eq 'none') {
            $msg = 'Windows build is UNSIGNED (no signing secrets). SmartScreen will show "Windows protected your PC".'
            Write-Host "::warning::$msg"
            Add-Content $env:GITHUB_STEP_SUMMARY "- Windows: $msg"
            exit 0
          }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f : $($sig.Status) | signer: $($sig.SignerCertificate.Subject) | timestamp: $($sig.TimeStamperCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$f signature is $($sig.Status)" }
            if (-not $sig.TimeStamperCertificate) { throw "$f has no timestamp" }
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "- Windows: app exe and installer Authenticode-signed via $env:METHOD (timestamped)."

      # ------------------------------------------------------------------ macOS
      - name: Import Apple Developer ID
        if: runner.os == 'macOS' && steps.signing.outputs.apple_sign == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE || secrets.MACOS_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/macos-keychain.sh import
      - name: Build macOS
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          # Empty → sign-macos.sh picks the imported identity, or ad-hoc signs without one.
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.apple_sign == 'true' && (secrets.APPLE_SIGNING_IDENTITY || secrets.APPLE_SIGN_IDENTITY) || '' }}
        run: ./scripts/build.sh darwin
      # Lays out the drag-to-Applications window without needing Finder (see build/darwin/dmg-settings.py).
      - name: Install dmgbuild
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7
          echo "$RUNNER_TEMP/dmgbuild/bin" >> "$GITHUB_PATH"
      - name: Package macOS dmg
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh build/bin/Dlyven.app build/bin/Dlyven.dmg
      - name: Notarize macOS
        if: runner.os == 'macOS' && steps.signing.outputs.apple_notary != 'none'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Submitting the dmg notarizes the app inside it; staple both (the .zip ships the app).
        run: ./scripts/notarize-macos.sh build/bin/Dlyven.dmg build/bin/Dlyven.app
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        env:
          APPLE_SIGN: ${{ steps.signing.outputs.apple_sign }}
          APPLE_NOTARY: ${{ steps.signing.outputs.apple_notary }}
        run: |
          codesign --verify --deep --strict --verbose=2 build/bin/Dlyven.app
          codesign -dv --verbose=2 build/bin/Dlyven.app 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|Signature|Timestamp|Runtime|CodeDirectory)' || true
          if [ "$APPLE_SIGN" != true ]; then
            msg="macOS build is only AD-HOC signed: not Developer ID signed, not notarized. Gatekeeper will ask users to confirm the first launch."
          elif [ "$APPLE_NOTARY" = none ]; then
            msg="macOS build is Developer ID signed but NOT notarized (no notarization secrets). Gatekeeper will still warn."
          else
            spctl -a -vvv -t exec build/bin/Dlyven.app
            spctl -a -vvv -t open --context context:primary-signature build/bin/Dlyven.dmg
            echo "- macOS: Developer ID signed, notarized ($APPLE_NOTARY) and stapled (.app and .dmg)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::$msg"
          echo "- macOS: $msg" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete temporary keychain
        if: always() && runner.os == 'macOS' && steps.signing.outputs.apple_sign == 'true'
        run: bash .github/scripts/macos-keychain.sh cleanup

      # ------------------------------------------------------------------ Linux
      - name: Build Linux
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/build.sh linux

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.name }}" in
            windows-amd64)
              cp build/bin/Dlyven.exe dist/${{ matrix.artifact }}
              cp build/bin/Dlyven-amd64-installer.exe dist/${{ matrix.installer }}
              ;;
            macos-universal)
              # ditto keeps the code signature and stapled ticket intact.
              ditto -c -k --keepParent build/bin/Dlyven.app "dist/${{ matrix.artifact }}"
              cp build/bin/Dlyven.dmg dist/${{ matrix.installer }}
              ;;
            linux-amd64|linux-arm64)
              cp build/bin/Dlyven dist/${{ matrix.artifact }}
              chmod +x dist/${{ matrix.artifact }}
              ;;
          esac
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" - <<'PY'
          import hashlib, pathlib
          for p in sorted(pathlib.Path("dist").iterdir()):
              if p.suffix == ".sha256":
                  continue
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              (p.parent / f"{p.name}.sha256").write_text(f"{digest}  {p.name}\n")
              print(f"{digest}  {p.name}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: dist/*

  tag:
    name: Tag
    needs: decide
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      github.event_name != 'pull_request' &&
      !startsWith(github.ref, 'refs/tags/v') &&
      needs.decide.result == 'success' &&
      needs.decide.outputs.should == 'true' &&
      needs.decide.outputs.tagger == 'app'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TAG_TOKEN }}
      - name: Push the tag (the tag run builds and publishes it)
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::tag v${VERSION} already exists; refusing to move or reuse it"
            exit 1
          fi
          git tag "v${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/v${VERSION}"

  publish:
    name: GitHub Release
    needs: [decide, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      always() &&
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.build.result != 'cancelled' &&
      needs.build.result != 'skipped' &&
      needs.decide.result == 'success' &&
      needs.decide.outputs.should == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          # Only the per-OS build artifacts, not the SignPath staging uploads.
          pattern: "{windows,macos,linux}-*"
          merge-multiple: true
      - name: Combined checksums
        run: |
          cd dist
          cat *.sha256 | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Sign checksums (GPG)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_PASSPHRASE" ]; then
            echo "No GPG_PRIVATE_KEY / GPG_PASSPHRASE: SHA256SUMS.txt is published without a .asc signature."
            exit 0
          fi
          bash .github/scripts/gpg-sign.sh dist/SHA256SUMS.txt
      # Only when this run is the one that builds from main (no RELEASE_TAG_TOKEN). A tag that
      # exists already must point at this commit, otherwise nothing is published.
      - name: Tag
        if: startsWith(github.ref, 'refs/heads/') && needs.decide.outputs.tagger != 'app'
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            [ "$(git rev-list -n 1 "v${VERSION}")" = "${GITHUB_SHA}" ] || { echo "::error::tag v${VERSION} exists on another commit"; exit 1; }
            echo "tag v${VERSION} already exists on this commit"
          else
            git tag "v${VERSION}" "${GITHUB_SHA}"
            git push origin "refs/tags/v${VERSION}" || {
              echo "::error::could not create tag v${VERSION}. If the repo rules restrict tag creation, add the RELEASE_TAG_TOKEN secret (docs/RELEASING.md) or push the tag yourself."
              exit 1
            }
          fi
      - name: Download table
        id: notes
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.decide.outputs.version) }}
        run: |
          bash .github/scripts/release-notes.sh "$TAG" dist > release-notes.md
          cat release-notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # body_path goes above GitHub's generated changelog.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: Dlyven ${{ steps.notes.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*
